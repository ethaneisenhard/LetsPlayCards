<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1480" role="img" aria-labelledby="title desc">
  <title id="title">Five sets of card marks, drawn as simple pictures</title>
  <desc id="desc">Drawings of the four marks on the cards - later called suits - from China, Egypt, Italy and Spain, Germany, and France. These are original drawings, not photos of old packs.</desc>
  <defs>
    <style>
      .bg { fill: #111827; }
      .panel { fill: #1a2233; stroke: rgba(255,255,255,.1); stroke-width: 1; }
      .card { fill: #f4efe4; stroke: #c9b896; stroke-width: 1.4; }
      .k { fill: #c9a84c; font: 700 15px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .t { fill: #ffffff; font: 700 22px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .s { fill: #c3cad5; font: 400 15px/1.35 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .lab { fill: #3f2a14; font: 700 13px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-anchor: middle; }
      .red { fill: #b42318; }
      .black { fill: #1f2937; }
    </style>
  </defs>
  <rect class="bg" width="390" height="1480"/>

  <rect class="panel" x="8" y="8" width="374" height="280" rx="16"/>
  <text class="k" x="24" y="36">800s-1400s / China</text>
  <text class="t" x="24" y="64">Money marks</text>
  <text class="s" x="24" y="88">Coins and strings of coins - a card</text>
  <text class="s" x="24" y="108">could stand in for cash on the table.</text>
  <g transform="translate(22,128)">
    <rect class="card" width="80" height="140" rx="8"/>
    <circle cx="40" cy="52" r="22" fill="none" stroke="#8a6a2f" stroke-width="4"/>
    <rect x="31" y="43" width="18" height="18" fill="#8a6a2f"/>
    <text class="lab" x="40" y="122">coin</text>
  </g>
  <g transform="translate(110,128)">
    <rect class="card" width="80" height="140" rx="8"/>
    <rect x="37" y="18" width="6" height="72" rx="2" fill="#6b4226"/>
    <circle cx="40" cy="34" r="10" fill="none" stroke="#8a6a2f" stroke-width="3"/>
    <circle cx="40" cy="54" r="10" fill="none" stroke="#8a6a2f" stroke-width="3"/>
    <circle cx="40" cy="74" r="10" fill="none" stroke="#8a6a2f" stroke-width="3"/>
    <text class="lab" x="40" y="122">string</text>
  </g>
  <g transform="translate(198,128)">
    <rect class="card" width="80" height="140" rx="8"/>
    <text x="40" y="64" text-anchor="middle" fill="#3f2a14" font-size="36" font-weight="700" font-family="serif">?</text>
    <text class="lab" x="40" y="122">myriad</text>
  </g>
  <g transform="translate(286,128)">
    <rect class="card" width="80" height="140" rx="8"/>
    <text x="40" y="60" text-anchor="middle" fill="#3f2a14" font-size="26" font-weight="700" font-family="serif">??</text>
    <text class="lab" x="40" y="122">myriads</text>
  </g>

  <rect class="panel" x="8" y="300" width="374" height="280" rx="16"/>
  <text class="k" x="24" y="328">1200s-1500s / Egypt</text>
  <text class="t" x="24" y="356">Mamluk marks</text>
  <text class="s" x="24" y="380">Cups, coins, swords, polo sticks -</text>
  <text class="s" x="24" y="400">the four families on a 52-card pack.</text>
  <g transform="translate(22,420)">
    <rect class="card" width="80" height="140" rx="8"/>
    <path d="M26 28 h28 a8 8 0 0 1 8 8 v12 c0 14-10 22-22 22s-22-8-22-22 v-12 a8 8 0 0 1 8-8z" fill="#7a3e6d"/>
    <rect x="37" y="70" width="6" height="14" fill="#7a3e6d"/>
    <text class="lab" x="40" y="122">cup</text>
  </g>
  <g transform="translate(110,420)">
    <rect class="card" width="80" height="140" rx="8"/>
    <circle cx="40" cy="52" r="22" fill="#c9a227"/>
    <circle cx="40" cy="52" r="10" fill="#f4efe4"/>
    <text class="lab" x="40" y="122">coin</text>
  </g>
  <g transform="translate(198,420)">
    <rect class="card" width="80" height="140" rx="8"/>
    <path d="M22 86 L58 24" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
    <path d="M52 20 l12 6 -4 12z" fill="#4b5563"/>
    <text class="lab" x="40" y="122">sword</text>
  </g>
  <g transform="translate(286,420)">
    <rect class="card" width="80" height="140" rx="8"/>
    <path d="M20 84 L62 28" stroke="#6b4226" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="24" cy="88" rx="12" ry="6" fill="#8a6a2f"/>
    <text class="lab" x="40" y="122">polo</text>
  </g>

  <rect class="panel" x="8" y="592" width="374" height="280" rx="16"/>
  <text class="k" x="24" y="620">Late 1300s / Italy and Spain</text>
  <text class="t" x="24" y="648">Cups, coins, swords, clubs</text>
  <text class="s" x="24" y="672">Polo was unfamiliar, so the stick</text>
  <text class="s" x="24" y="692">family became a club or baton.</text>
  <g transform="translate(22,712)">
    <rect class="card" width="80" height="140" rx="8"/>
    <path d="M28 26 h24 c10 0 16 8 16 16 0 14-10 22-28 28-18-6-28-14-28-28 0-8 6-16 16-16z" fill="#c45c26"/>
    <rect x="37" y="70" width="6" height="16" fill="#8a6a2f"/>
    <text class="lab" x="40" y="122">cup</text>
  </g>
  <g transform="translate(110,712)">
    <rect class="card" width="80" height="140" rx="8"/>
    <circle cx="40" cy="52" r="22" fill="#d4a017"/>
    <text x="40" y="60" text-anchor="middle" fill="#6b4226" font-size="20" font-weight="700" font-family="serif">+</text>
    <text class="lab" x="40" y="122">coin</text>
  </g>
  <g transform="translate(198,712)">
    <rect class="card" width="80" height="140" rx="8"/>
    <path d="M30 88 L54 22" stroke="#2f4a6e" stroke-width="5" stroke-linecap="round"/>
    <path d="M48 18 l14 8 -6 10z" fill="#2f4a6e"/>
    <path d="M26 76 q10 12 22 6" fill="none" stroke="#2f4a6e" stroke-width="3"/>
    <text class="lab" x="40" y="122">sword</text>
  </g>
  <g transform="translate(286,712)">
    <rect class="card" width="80" height="140" rx="8"/>
    <path d="M40 22 v64" stroke="#6b4226" stroke-width="6" stroke-linecap="round"/>
    <circle cx="40" cy="32" r="9" fill="#3f6b3a"/>
    <circle cx="28" cy="48" r="8" fill="#3f6b3a"/>
    <circle cx="52" cy="48" r="8" fill="#3f6b3a"/>
    <text class="lab" x="40" y="122">club</text>
  </g>

  <rect class="panel" x="8" y="884" width="374" height="280" rx="16"/>
  <text class="k" x="24" y="912">1400s / German lands</text>
  <text class="t" x="24" y="940">Hearts, bells, acorns, leaves</text>
  <text class="s" x="24" y="964">Makers tried new pictures. These</text>
  <text class="s" x="24" y="984">four became the German set.</text>
  <g transform="translate(22,1004)">
    <rect class="card" width="80" height="140" rx="8"/>
    <path class="red" d="M40 86 C18 64 16 44 30 34 c8-5 12 2 10 10 0-8 4-15 10-10 14 10 12 30-10 52z"/>
    <text class="lab" x="40" y="122">heart</text>
  </g>
  <g transform="translate(110,1004)">
    <rect class="card" width="80" height="140" rx="8"/>
    <ellipse cx="40" cy="40" rx="16" ry="14" fill="#d4a017"/>
    <rect x="36" y="52" width="8" height="16" fill="#8a6a2f"/>
    <circle cx="40" cy="74" r="5" fill="#8a6a2f"/>
    <text class="lab" x="40" y="122">bell</text>
  </g>
  <g transform="translate(198,1004)">
    <rect class="card" width="80" height="140" rx="8"/>
    <ellipse cx="40" cy="58" rx="14" ry="16" fill="#6b4226"/>
    <path d="M24 46 h32 c-3 12-12 16-16 16s-13-4-16-16z" fill="#3f2a14"/>
    <rect x="36" y="24" width="8" height="20" fill="#3f6b3a"/>
    <text class="lab" x="40" y="122">acorn</text>
  </g>
  <g transform="translate(286,1004)">
    <rect class="card" width="80" height="140" rx="8"/>
    <path d="M40 22 c24 20 24 42 0 60 C16 64 16 42 40 22z" fill="#3f6b3a"/>
    <path d="M40 30 v44" stroke="#1f3320" stroke-width="2"/>
    <text class="lab" x="40" y="122">leaf</text>
  </g>

  <rect class="panel" x="8" y="1176" width="374" height="296" rx="16"/>
  <text class="k" x="24" y="1204">Around 1480 / France</text>
  <text class="t" x="24" y="1232">Hearts, diamonds, clubs, spades</text>
  <text class="s" x="24" y="1256">Cheap two-color stencil marks - the</text>
  <text class="s" x="24" y="1276">four families in a kitchen-drawer pack.</text>
  <g transform="translate(22,1296)">
    <rect class="card" width="80" height="156" rx="8"/>
    <path class="red" d="M40 96 C18 74 16 54 30 44 c8-5 12 2 10 10 0-8 4-15 10-10 14 10 12 30-10 52z"/>
    <text class="lab" x="40" y="138">heart</text>
  </g>
  <g transform="translate(110,1296)">
    <rect class="card" width="80" height="156" rx="8"/>
    <path class="red" d="M40 32 l22 26 -22 26 -22-26z"/>
    <text class="lab" x="40" y="138">diamond</text>
  </g>
  <g transform="translate(198,1296)">
    <rect class="card" width="80" height="156" rx="8"/>
    <circle cx="40" cy="40" r="10" class="black"/>
    <circle cx="28" cy="56" r="10" class="black"/>
    <circle cx="52" cy="56" r="10" class="black"/>
    <rect x="36" y="56" width="8" height="22" class="black"/>
    <text class="lab" x="40" y="138">club</text>
  </g>
  <g transform="translate(286,1296)">
    <rect class="card" width="80" height="156" rx="8"/>
    <path class="black" d="M40 28 c18 16 22 28 0 44 C18 56 22 44 40 28z"/>
    <rect x="36" y="68" width="8" height="16" class="black"/>
    <text class="lab" x="40" y="138">spade</text>
  </g>
</svg>
