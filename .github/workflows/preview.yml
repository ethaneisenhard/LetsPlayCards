name: Preview

# Per-PR Workers (Durable Objects block Cloudflare's built-in preview URLs).
#
# GitHub only starts this workflow when the file exists on the *merge* of the
# PR (head + base). PRs that target a stale branch without this file never
# run — retarget main or merge main into the PR. Checkout always uses the
# merge ref so preview scripts from the base and the PR's app code are both
# present even when the head branch predates this workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to build a preview for
        required: true
        type: string

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.meta.outputs.url }}
      worker: ${{ steps.meta.outputs.worker }}
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/merge

      - name: Require preview scripts
        run: |
          test -f scripts/preview-meta.ts
          test -f scripts/write-preview-config.ts
          test -f scripts/assert-preview-live.ts
          test -f scripts/assert-preview-bundle.ts
          test -f scripts/stamp-asset-hashes.ts
          test -f src/ci/preview-pure.ts
          git log -1 --oneline

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Preview worker name + URL
        id: meta
        run: pnpm exec tsx scripts/preview-meta.ts --pr "${{ env.PR_NUMBER }}" --branch "${{ github.head_ref || github.ref_name }}"

      - name: Refuse production Worker name
        run: |
          if [ "${{ steps.meta.outputs.worker }}" = "letsplaycards" ]; then
            echo "Refusing to deploy preview onto production worker letsplaycards"
            exit 1
          fi

      - name: Ensure shared preview D1
        id: d1
        run: |
          ID=$(pnpm exec tsx scripts/ensure-preview-d1.ts)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Preview D1: $ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Write preview wrangler config
        run: |
          pnpm exec tsx scripts/write-preview-config.ts \
            --name "${{ steps.meta.outputs.worker }}" \
            --d1 "${{ steps.d1.outputs.id }}" \
            --out .scratch/wrangler.preview.json

      - name: Apply preview D1 migrations
        run: pnpm exec wrangler d1 migrations apply letsplaycards-preview --remote -c .scratch/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy preview Worker
        run: pnpm exec wrangler deploy -c .scratch/wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe preview URL
        run: pnpm exec tsx scripts/assert-preview-live.ts --url "${{ steps.meta.outputs.url }}/"

      - name: Probe hashed client bundle
        run: pnpm exec tsx scripts/assert-preview-bundle.ts --origin "${{ steps.meta.outputs.url }}"

      - name: Comment preview URL on PR
        if: env.PR_NUMBER
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.meta.outputs.url }}';
            const worker = '${{ steps.meta.outputs.worker }}';
            const marker = '<!-- lpc-preview-url -->';
            const body = [
              marker,
              '### Preview',
              '',
              `**${url}**`,
              '',
              `Worker \`${worker}\` · shared preview D1 (not production).`,
              '',
              '_Updated with each push to this PR. Job fails unless this URL returns HTTP 200._',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body,
              });
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout default branch (preview scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve preview Worker
        id: meta
        run: pnpm exec tsx scripts/preview-meta.ts --pr "${{ github.event.pull_request.number }}"

      - name: Delete preview Worker
        continue-on-error: true
        run: |
          if [ "${{ steps.meta.outputs.worker }}" = "letsplaycards" ]; then
            echo "Refusing to delete production worker"
            exit 1
          fi
          pnpm exec wrangler delete "${{ steps.meta.outputs.worker }}" --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment cleanup on PR
        if: github.event.pull_request.number
        uses: actions/github-script@v7
        with:
          script: |
            const worker = '${{ steps.meta.outputs.worker }}';
            const marker = '<!-- lpc-preview-url -->';
            const body = [
              marker,
              '### Preview',
              '',
              `Preview Worker \`${worker}\` deleted (PR closed).`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }
